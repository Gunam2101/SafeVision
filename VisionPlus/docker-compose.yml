services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: visionplus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visionplus}
      POSTGRES_DB: visionplus
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionplus"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://visionplus:${POSTGRES_PASSWORD:-visionplus}@db:5432/visionplus
      SECRET_KEY: ${SECRET_KEY:-change-this-to-a-long-random-string-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      GROK_API_KEY: ${GROK_API_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      DETECTION_SAMPLE_EVERY: 5
    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
      - ai_models:/app/ai_models
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  uploads:
  reports:
  ai_models:
